name: Update netlink specs

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:

jobs:
  update-nlspec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Import specs
        id: import
        run: |
          ruby nl-linux/bin/import-nlspec

      - name: Push branch and open PR
        if: steps.import.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          BRANCH="update-nlspec/v${{ steps.import.outputs.version }}"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists on origin, skipping." >&2
            exit 0
          fi
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Update netlink specs to Linux v${{ steps.import.outputs.version }}" \
            --body "Automated update of netlink specs from the Linux kernel v${{ steps.import.outputs.version }} tree." \
            --base master \
            --head "$BRANCH"
