name: Main

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 15 * * 5'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.321.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Generate
      run: bundle exec rake generate
    - name: Run tests
      run: bundle exec rake spec
      env:
        COVERAGE: 'true'
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2.3.8
      with:
        file: coverage/.resultset.json
        format: simplecov
        github-token: ${{ github.token }}
        fail-on-error: false
        flag-name: ruby-${{ matrix.ruby }}
        parallel: true

  coveralls-finish:
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-slim
    permissions: {}
    steps:
    - name: Finish Coveralls parallel build
      uses: coverallsapp/github-action@v2.3.8
      with:
        github-token: ${{ github.token }}
        fail-on-error: false
        parallel-finished: true

  bundle-install:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@v1.321.0
      with:
        ruby-version: ruby
    - run: |
        bundle config set --local deployment true
        bundle install
    - id: upload
      uses: actions/upload-artifact@v7.0.1
      with:
        name: bundle
        path: |
          .bundle/config
          vendor/bundle

  build:
    needs: [bundle-install, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@v1.321.0
      with:
        ruby-version: ruby
    - uses: actions/download-artifact@v8.0.1
      with:
        artifact-ids: ${{ needs.bundle-install.outputs.artifact-id }}
    - uses: release-gems/action/build@v1.2.2
      with:
        sandbox: bubblewrap

  doc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.321.0
      with:
        ruby-version: ruby
        bundler-cache: true
    - name: Generate
      run: bundle exec rake generate
    - name: Generate documentation
      run: bundle exec yardoc
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: doc

  ci-pass:
    if: ${{ always() }}
    needs: [build, doc]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
    - name: Check required jobs
      if: ${{ needs.build.result != 'success' || needs.doc.result != 'success' }}
      run: exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    environment: rubygems.org
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: release-gems/action/publish@v1.2.2

  publish-doc:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, doc]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5.0.1
