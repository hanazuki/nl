name: Main

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '0 15 * * 5'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '3.4'
          - '4.0'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Generate
      run: bundle exec rake generate
    - name: Run tests
      run: bundle exec rake spec
      env:
        COVERAGE: 'true'
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        file: coverage/.resultset.json
        format: simplecov
        github-token: ${{ github.token }}
        fail-on-error: false
        flag-name: ruby-${{ matrix.ruby }}
        parallel: true

  coveralls-finish:
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-slim
    permissions: {}
    steps:
    - name: Finish Coveralls parallel build
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ github.token }}
        fail-on-error: false
        parallel-finished: true

  bundle-install:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ruby
    - run: |
        bundle config set --local deployment true
        bundle install
    - id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bundle
        path: |
          .bundle/config
          vendor/bundle

  build:
    needs: [bundle-install, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ruby
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ needs.bundle-install.outputs.artifact-id }}
    - uses: release-gems/action/build@4aaa7904a8e9de7f0f4a5b646e3cfe8f1e225c2b # v1.2.1
      with:
        sandbox: bubblewrap

  doc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ruby
        bundler-cache: true
    - name: Generate
      run: bundle exec rake generate
    - name: Generate documentation
      run: bundle exec yardoc
    - name: Upload GitHub Pages artifact
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: doc

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    environment: rubygems.org
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: release-gems/action@4aaa7904a8e9de7f0f4a5b646e3cfe8f1e225c2b # v1.2.1

  publish-doc:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, doc]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
