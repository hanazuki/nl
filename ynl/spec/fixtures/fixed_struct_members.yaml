name: fixed-struct-members
protocol: genetlink
definitions:
  -
    name: outer
    type: struct
    members:
      - { name: prefix, type: u8 }
      - { name: bytes, type: binary, len: 3 }
      - { name: inner, type: binary, struct: inner }
      - { name: suffix, type: u8 }
  -
    name: inner
    type: struct
    members:
      - { name: value, type: u16 }
  -
    name: scalars
    type: struct
    members:
      - { name: host, type: u32 }
      - { name: little-byte, type: u8, byte-order: little-endian }
      - { name: big-byte, type: s8, byte-order: big-endian }
      - { name: little-short, type: u16, byte-order: little-endian }
      - { name: big-short, type: s16, byte-order: big-endian }
      - { name: big-word, type: u32, byte-order: big-endian }
      - { name: little-word, type: s32, byte-order: little-endian }
      - { name: little-long, type: u64, byte-order: little-endian }
      - { name: big-long, type: s64, byte-order: big-endian }
      - { name: native-int, type: int }
  -
    name: grouped
    type: struct
    members:
      - { name: byte-a, type: u8 }
      - { name: byte-b, type: s8 }
      - { name: byte-c, type: u8 }
      - { name: byte-d, type: s8 }
      - { name: short-a, type: u16 }
      - { name: short-b, type: s16 }
      - { name: mixed-a, type: u8 }
      - { name: mixed-b, type: s16, byte-order: big-endian }
      - { name: mixed-c, type: u8 }
      - { name: tail, type: u8 }
  -
    name: variable-integer
    type: struct
    members:
      - { name: value, type: uint }
  -
    name: padded
    type: struct
    members:
      - { name: prefix, type: u8 }
      - { name: reserved, type: pad, len: 3 }
      - { name: suffix, type: u32 }
attribute-sets:
  -
    name: attrs
    attributes:
      -
        name: record
        type: binary
        struct: outer
        checks:
          exact-len: 7
      -
        name: extensible-record
        type: binary
        struct: outer
operations:
  list:
    -
      name: echo
      attribute-set: attrs
      do:
        request:
          attributes: [record]
        reply:
          attributes: [record]
